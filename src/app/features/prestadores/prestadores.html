<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Listagem de Prestadores</h1>
        <button mat-raised-button color="primary" class="btn-new-prestador" (click)="abrirModalNovoPrestador()">
            <mat-icon>add</mat-icon> Novo prestador
        </button>
    </div>

    <div class="filters-row">
        <mat-form-field appearance="outline" class="search-field">
            <mat-icon matPrefix>search</mat-icon>
            <input matInput placeholder="Pesquisar por nome, documento ou serviço">
        </mat-form-field>
    </div>

    <mat-card class="table-card">
        <table mat-table [dataSource]="prestadores" class="prestadores-table">

            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef> Nome </th>
                <td mat-cell *matCellDef="let item"> {{ item.nome }} </td>
            </ng-container>

            <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef> Tipo </th>
                <td mat-cell *matCellDef="let item"> {{ item.tipo }} </td>
            </ng-container>

            <ng-container matColumnDef="servico">
                <th mat-header-cell *matHeaderCellDef> Serviço </th>
                <td mat-cell *matCellDef="let item"> {{ item.servico }} </td>
            </ng-container>

            <ng-container matColumnDef="cidade">
                <th mat-header-cell *matHeaderCellDef> Cidade </th>
                <td mat-cell *matCellDef="let item"> {{ item.cidade }} </td>
            </ng-container>

            <ng-container matColumnDef="telefone">
                <th mat-header-cell *matHeaderCellDef> Telefone </th>
                <td mat-cell *matCellDef="let item"> {{ item.telefone }} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let item">
                    <span class="status-chip"
                        [ngClass]="{'ativo': item.status === 'Ativo', 'inativo': item.status === 'Inativo'}">
                        {{ item.status }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="acoes">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let item">
                    <button mat-stroked-button color="primary" class="action-btn">
                        <mat-icon>visibility</mat-icon> Ver
                    </button>
                    <button mat-stroked-button color="primary" class="action-btn">
                        <mat-icon>edit</mat-icon> Editar
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page">
        </mat-paginator>
    </mat-card>
</div>
