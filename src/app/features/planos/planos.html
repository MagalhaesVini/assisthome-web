<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Listagem de Planos</h1>
    <button mat-raised-button color="primary" class="btn-new-plan" (click)="abrirModalNovoPlano()">
      <mat-icon>add</mat-icon> Novo plano
    </button>
  </div>

  <div class="filters-row">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Pesquisar por nome do plano">
    </mat-form-field>
  </div>

  <mat-card class="table-card">
    <table mat-table [dataSource]="planos" class="planos-table">

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let plano"> {{ plano.nome }} </td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let plano"> {{ plano.descricao }} </td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef> Valor mensal </th>
        <td mat-cell *matCellDef="let plano"> {{ plano.valor }} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let plano">
          <span class="status-chip"
            [ngClass]="{'ativo': plano.status === 'Ativo', 'inativo': plano.status === 'Inativo'}">
            {{ plano.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let plano">
          <button mat-stroked-button color="primary" class="action-btn">
            <mat-icon>visibility</mat-icon> Ver
          </button>
          <button mat-stroked-button color="primary" class="action-btn">
            <mat-icon>edit</mat-icon> Editar
          </button>
          <button mat-stroked-button color="warn" class="action-btn" *ngIf="plano.status === 'Ativo'">
            Inativar
          </button>
          <button mat-stroked-button color="primary" class="action-btn" *ngIf="plano.status === 'Inativo'">
            Ativar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page">
    </mat-paginator>
  </mat-card>
</div>
