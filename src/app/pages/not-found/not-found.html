<div class="not-found-container">
    <div class="content-box">
        <mat-icon class="error-icon">error_outline</mat-icon>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página não encontrada</h2>
        <p class="error-message">
            A URL que você tentou acessar não existe no sistema.
            Verifique o endereço ou retorne para a página inicial.
        </p>
        <button mat-raised-button color="primary" routerLink="/clientes" class="back-btn">
            <mat-icon>home</mat-icon> Voltar para a página inicial
        </button>
    </div>
</div>
