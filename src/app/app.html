<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [opened]="opened()" mode="side" class="custom-sidenav">
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header [title]="title()" (toggleMenu)="opened.set(!opened())"></app-header>

    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
