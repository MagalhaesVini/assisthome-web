<div class="sidebar-container">
  <div class="brand-section">
    <mat-icon class="brand-icon">verified_user</mat-icon>
    <span class="brand-name">AssistHome</span>
  </div>

  <mat-nav-list>
    @for (item of menuItems; track item.route) {
    <a mat-list-item [routerLink]="item.route" routerLinkActive="active-menu-item" class="menu-item">
      <mat-icon matListItemIcon class="menu-icon">{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
    }
  </mat-nav-list>

  <div class="help-section">
    <button mat-button class="help-btn">
      <mat-icon>help_outline</mat-icon>
      <span>Ajuda e suporte</span>
      <mat-icon class="arrow-icon">chevron_right</mat-icon>
    </button>
  </div>
</div>
